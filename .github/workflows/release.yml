# 배포 zip 을 만들어 GitHub Release 에 올린다.
#
# - 태그 vX.Y.Z 를 push 하면: 테스트 → zip → 설치 파일 → libmpv 대응 소스 zip → 그 태그로 Release 생성 (하이픈이 든 태그는 프리릴리스)
# - Actions 탭에서 수동 실행하면: 테스트 → zip · 설치 파일을 워크플로 아티팩트로만 올린다 (Release 는 만들지 않음)
#
# zip 은 tools/publish.ps1, 설치 파일은 tools/build-installer.ps1 로 만든다. 로컬에서 같은 스크립트로 같은 결과를 확인할 수 있다.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 버전 결정
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "태그 형식이 vX.Y.Z 가 아닙니다: $env:GITHUB_REF_NAME" }
          } else {
            $base = ([xml](Get-Content src/OtogeTrainer.App/OtogeTrainer.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=OtogeTrainer-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: 단위 테스트
        run: dotnet test OtogeTrainer.sln -c Release

      - name: 배포 zip 만들기
        run: ./tools/publish.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Inno Setup 준비
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: 설치 파일 만들기
        run: ./tools/build-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: libmpv 대응 소스 묶기 (GPL)
        if: github.ref_type == 'tag'
        run: ./tools/bundle-libmpv-source.ps1

      - name: 아티팩트 업로드 (수동 실행)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            artifacts/release/${{ steps.version.outputs.name }}.zip
            artifacts/release/${{ steps.version.outputs.name }}.zip.sha256
            artifacts/release/${{ steps.version.outputs.name }}-setup.exe
            artifacts/release/${{ steps.version.outputs.name }}-setup.exe.sha256

      - name: Release 생성
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $name = '${{ steps.version.outputs.name }}'
          $notes = @"
          ## 설치
          Windows 10 (1809+) / 11, x64. 관리자 권한 · .NET 설치가 필요 없습니다.

          - **설치 파일**: ``$name-setup.exe`` 를 실행하세요. 시작 메뉴에 등록되고, 새 버전을 설치하면 그대로 업데이트됩니다.
          - **포터블 zip**: ``$name.zip`` 을 원하는 폴더에 풀고 ``OtogeTrainer.exe`` 를 실행하세요.

          라이브러리 · 설정은 ``%APPDATA%\OtogeTrainer\`` 에 저장되므로, 업데이트하거나 설치 방식을 바꿔도 그대로 이어집니다.

          ## 라이선스
          GPL-3.0-or-later. 포함된 libmpv 와 그 밖의 구성요소는 zip 안의 ``THIRD-PARTY-NOTICES.md`` 를 보세요.
          대응 소스: OtogeTrainer 는 아래 Source code, 함께 배포하는 libmpv 는 ``libmpv-source-*.zip`` (mpv · FFmpeg 소스와 빌드 스크립트).
          "@
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME `
            "artifacts/release/$name.zip" `
            "artifacts/release/$name.zip.sha256" `
            "artifacts/release/$name-setup.exe" `
            "artifacts/release/$name-setup.exe.sha256" `
            (Get-Item artifacts/release/libmpv-source-*.zip).FullName `
            --title "OtogeTrainer $version" `
            --notes $notes `
            --generate-notes `
            @flags
